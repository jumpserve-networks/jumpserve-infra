name: Diagnose dedicated intake bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: intake-bootstrap-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install boto3==1.42.4
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::395567831870:role/JumpServePlatformRelease
          role-session-name: intake-diagnostics-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: '395567831870'
          role-duration-seconds: 900
          unset-current-credentials: true
      # Read-only diagnostics bind to the source-verified CloudFormation host;
      # no caller-supplied commands or desktop credentials are accepted.
      - run: python3 -B bin/intake-bootstrap-diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-bootstrap-diagnostics
          path: .test-artifacts/intake-bootstrap/
          include-hidden-files: true
          retention-days: 3
