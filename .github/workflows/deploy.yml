name: Deploy Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jumpserve_prompt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned real-world runtime revision
        id: real-world-runtime
        run: echo "revision=$(python3 -c 'import json; print(json.load(open("real-world-runtime.json"))["revision"])')" >> "$GITHUB_OUTPUT"

      - name: Check out real-world runtime
        uses: actions/checkout@v4
        with:
          repository: jumpserve-networks/jumpserve-back-end
          ref: ${{ steps.real-world-runtime.outputs.revision }}
          path: .runtime-backend

      - name: Test real-world runtime
        run: python3 -B -m unittest discover -s .runtime-backend/real_world/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Test experiment analysis and infrastructure
        run: |
          npm run test:ami
          npm run test:agent:database
          npm run test:database:rls
          npm test -- --runInBand
          npm run build
        env:
          PROMPT_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/jumpserve_prompt_test

      - name: Evaluate research answers with Bedrock
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        timeout-minutes: 15
        run: |
          python -m pip install strands-agents httpx boto3
          python -B test/evaluate_agent.py --live --bootstrap-if-empty
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Save answer evaluation report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: agent-answer-evaluation
          path: .test-artifacts/agent-evaluation.json
          if-no-files-found: ignore

      - name: Install agent Python dependencies
        run: |
          pip install --target agent/layer/python --platform manylinux2014_x86_64 --only-binary=:all: --python-version 3.12 strands-agents httpx
          cd agent/layer/python && rm -rf __pycache__ */__pycache__ boto3 botocore s3transfer jmespath botocore-*.dist-info boto3-*.dist-info s3transfer-*.dist-info jmespath-*.dist-info

      - name: CDK Diff
        if: github.event_name == 'pull_request'
        run: npx cdk diff --all
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: CDK Deploy
        if: github.ref == 'refs/heads/main'
        run: npx cdk deploy --all --require-approval never
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
