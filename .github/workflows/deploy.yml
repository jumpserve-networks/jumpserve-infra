name: Deploy Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Test experiment analysis and infrastructure
        run: |
          npm run test:ami
          npm test -- --runInBand
          npm run build

      - name: Evaluate research answers with Bedrock
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        timeout-minutes: 15
        run: |
          python -m pip install strands-agents httpx boto3
          python -B test/evaluate_agent.py --live
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Save answer evaluation report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: agent-answer-evaluation
          path: .test-artifacts/agent-evaluation.json
          if-no-files-found: ignore

      - name: Install agent Python dependencies
        run: |
          pip install --target agent/layer/python --platform manylinux2014_x86_64 --only-binary=:all: --python-version 3.12 strands-agents httpx
          cd agent/layer/python && rm -rf __pycache__ */__pycache__ boto3 botocore s3transfer jmespath botocore-*.dist-info boto3-*.dist-info s3transfer-*.dist-info jmespath-*.dist-info

      - name: CDK Diff
        if: github.event_name == 'pull_request'
        run: npx cdk diff --all
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: CDK Deploy
        if: github.ref == 'refs/heads/main'
        run: npx cdk deploy --all --require-approval never
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
