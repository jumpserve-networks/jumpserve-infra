name: Validate Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jumpserve_prompt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned real-world runtime revision
        id: real-world-runtime
        run: echo "revision=$(python3 -c 'import json; print(json.load(open("real-world-runtime.json"))["revision"])')" >> "$GITHUB_OUTPUT"

      - name: Check out real-world runtime
        uses: actions/checkout@v4
        with:
          repository: jumpserve-networks/jumpserve-back-end
          ref: ${{ steps.real-world-runtime.outputs.revision }}
          path: .runtime-backend

      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read pinned research runtime revision
        id: research-runtime
        run: echo "revision=$(python3 -c 'import json; print(json.load(open("research-workflow-runtime.json"))["source_revision"])')" >> "$GITHUB_OUTPUT"

      - name: Check out research runtime
        uses: actions/checkout@v4
        with:
          repository: jumpserve-networks/jumpserve-back-end
          ref: ${{ steps.research-runtime.outputs.revision }}
          path: .runtime-research

      - name: Verify research runtime bytes and regressions
        run: |
          python3 -B bin/prepare-research-runtime.py --backend .runtime-research
          python3 -B bin/prepare-openclaw-worker.py --backend .runtime-research
          python3 -B bin/prepare-autonomy-runtime.py
          python3 -B -m unittest discover -s .runtime-research/research_workflow/tests -v

      - name: Test real-world runtime
        run: |
          python -m pip install -r .runtime-backend/real_world/requirements-test.txt
          python -B -m unittest discover -s .runtime-backend/real_world/tests -v

      - run: npm ci

      - name: Test experiment analysis and infrastructure
        run: |
          python -m pip install pydantic==2.13.5
          npm run test:ami
          npm run test:agent:database
          npm run test:database:rls
          npm run test:database:ingest
          npm test -- --runInBand
          npm run build
        env:
          PROMPT_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/jumpserve_prompt_test

      # Production releases use platform-release.yml with OIDC and exact
      # component/revision verification. Pull requests receive no AWS keys.
