name: Platform checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Platform validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: platform-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install boto3==1.42.4
      - name: Read pinned runtime revisions
        id: runtime
        run: |
          python3 -c 'import json,os; p=os.environ["GITHUB_OUTPUT"]; values={"research_api":json.load(open("research-api-runtime.json"))["source_revision"],"research":json.load(open("research-workflow-runtime.json"))["source_revision"],"real_world":json.load(open("real-world-runtime.json"))["revision"],"intake":json.load(open("intake-worker-runtime.json"))["source_revision"]}; open(p,"a").write("".join(k+"="+v+"\n" for k,v in values.items()))'
      - uses: actions/checkout@v4
        with:
          repository: jumpserve-networks/jumpserve-back-end
          ref: ${{ steps.runtime.outputs.intake }}
          path: .runtime-intake-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jumpserve-networks/jumpserve-back-end
          ref: ${{ steps.runtime.outputs.research }}
          path: .runtime-research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jumpserve-networks/jumpserve-back-end
          ref: ${{ steps.runtime.outputs.real_world }}
          path: .runtime-backend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jumpserve-networks/jumpserve-back-end
          ref: ${{ steps.runtime.outputs.research_api }}
          path: .runtime-research-api
          persist-credentials: false
      - name: Prepare and hash-check immutable runtime assets
        run: |
          python3 -B bin/prepare-research-runtime.py --backend .runtime-research
          python3 -B bin/prepare-research-api-runtime.py --backend .runtime-research-api
          python3 -B bin/prepare-openclaw-worker.py --backend .runtime-research
          python3 -B bin/prepare-autonomy-runtime.py
          python3 -B bin/prepare-intake-runtime.py --backend .runtime-intake-source
      - name: Check dedicated intake orchestration and complete byte budgets
        run: python3 -B -m unittest discover -s .runtime-intake-source/research_workflow/tests -p 'test_intake*.py' -v
      - name: Verify intake PDF dependency and actual parser subprocess
        run: python3 -B -m unittest discover -s test -p intake_pdf_bootstrap_test.py -v
      - run: npm ci --ignore-scripts
      - run: npm test -- --runInBand
      - run: npm run build
      - run: python3 -B -m unittest discover -s test -p platform_release_test.py -v
      - run: python3 -B -m unittest discover -s test -p platform_service_release_test.py -v
      - run: python3 -B -m unittest discover -s test -p release_github_auth_test.py -v
      - run: python3 -B -m unittest discover -s test -p category_budget_release_test.py -v
      - run: python3 -B -m unittest discover -s test -p research_runtime_release_test.py -v
      - run: python3 -B -m unittest discover -s test -p supervisor_runtime_release_test.py -v
      - run: python3 -B -m unittest discover -s test -p intake_release_test.py -v
      - run: python3 -B -m unittest discover -s test -p source_reader_gate_test.py -v
      - run: python3 -B -m unittest discover -s test -p retained_control_test.py -v
      - run: python3 -B -m unittest discover -s test -p platform_slack_test.py -v
      - run: node --test assets/platform/slack-tools/index.test.js
      - run: python3 -B -m unittest discover -s test -p integrated_research_release_test.py -v
      - run: python3 -B -m unittest discover -s test -p persistence_monitor_test.py -v
      - run: python3 -B test/check_platform_database.py
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql://postgres:platform-test-only@127.0.0.1:5432/postgres
      - name: Verify recovery, private Slack delegation and dedicated parallel intake
        run: python3 -B test/check_dedicated_intake_database.py
        env:
          PYTHONPATH: .runtime-research/research_workflow:test
          UNLIMITED_DEFAULTS_TEST_DATABASE_URL: postgresql://postgres:platform-test-only@127.0.0.1:5432/postgres
      - name: Verify owner-confirmed author corrections and legacy confirmations
        run: python3 -B test/check_paper_review_authors_database.py
        env:
          PYTHONPATH: .runtime-research/research_workflow:test
          UNLIMITED_DEFAULTS_TEST_DATABASE_URL: postgresql://postgres:platform-test-only@127.0.0.1:5432/postgres
      - name: Verify service handoffs, guarded intake recovery and repair lifecycle
        run: npm run test:platform:service-lifecycle
        env:
          PYTHONPATH: .runtime-research/research_workflow:test
          UNLIMITED_DEFAULTS_TEST_DATABASE_URL: postgresql://postgres:platform-test-only@127.0.0.1:5432/postgres
